name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-ref:
    name: Validate release tag
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tag to be in main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          python-version: "3.14"
          enable-cache: false
      - run: uv run --locked python scripts/check-tag.py "$RELEASE_TAG"

  ci:
    needs: verify-ref
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] (GitHub documents local workflow paths with ./)

  build:
    name: Build and test release distributions
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:26.8.36.3@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
        env:
          CLICKHOUSE_USER: chrag
          CLICKHOUSE_PASSWORD: ci-only
        ports:
          - 8123/tcp
        options: >-
          --health-cmd "clickhouse-client --user chrag --password ci-only --query 'SELECT 1'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          python-version: "3.14"
          enable-cache: false
      - name: Build, install and run the exact release files
        env:
          CLICKHOUSE_PORT: ${{ job.services.clickhouse.ports['8123'] }}
          CLICKHOUSE_USER: chrag
          CLICKHOUSE_PASSWORD: ci-only
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          uv build
          bash scripts/smoke-artifacts.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Create a GitHub release and attach the distributions.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - name: Publish verified release files
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release download "$RELEASE_TAG" --dir previous
            for artifact in dist/*; do
              cmp "$artifact" "previous/${artifact##*/}"
            done
          else
            args=()
            if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${args[@]}" dist/*
          fi

  pypi:
    name: Publish to PyPI
    needs: [build, github-release]
    if: vars.PUBLISH_TO_PYPI == 'true' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi-publish
      url: https://pypi.org/project/clickhouserag/
    permissions:
      id-token: write # Exchange the workflow identity for a PyPI upload token.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
