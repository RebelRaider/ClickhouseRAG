[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "clickhouserag"
version = "1.0.0a1"
description = "Filter-scoped retrieval for RAG applications backed by ClickHouse"
readme = "README.md"
requires-python = ">=3.11,<3.16"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["clickhouse", "rag", "hybrid-search", "vector-search", "retrieval"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = ["clickhouse-connect>=1.12,<2"]

[project.urls]
Repository = "https://github.com/RebelRaider/ClickhouseRAG"
Issues = "https://github.com/RebelRaider/ClickhouseRAG/issues"

[dependency-groups]
dev = [
    "bandit>=1.8",
    "coverage[toml]>=7.13",
    "hypothesis>=6.140",
    "pip-audit>=2.9",
    "pytest>=9",
    "ruff>=0.15",
    "twine>=6.2",
    "ty>=0.0.28",
]

[tool.hatch.build.targets.wheel]
packages = ["src/clickhouserag"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/README.md", "/LICENSE"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = ["integration: requires a real ClickHouse server"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["clickhouserag"]

[tool.coverage.report]
show_missing = true
