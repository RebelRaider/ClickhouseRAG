[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "clickhouserag"
version = "1.1.0-rc.1"
description = "Cited text, vector and graph retrieval for RAG applications on ClickHouse"
readme = "README.md"
requires-python = ">=3.11,<3.16"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "clickhouse",
    "retrieval-augmented-generation",
    "rag",
    "hybrid-search",
    "vector-search",
    "full-text-search",
    "information-retrieval",
    "embeddings",
    "graphrag",
    "knowledge-augmented-generation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
dependencies = ["clickhouse-connect>=1.12,<2"]

[project.urls]
Changelog = "https://github.com/RebelRaider/ClickhouseRAG/blob/main/CHANGELOG.md"
Documentation = "https://rebelraider.github.io/ClickhouseRAG/"
Repository = "https://github.com/RebelRaider/ClickhouseRAG"
Issues = "https://github.com/RebelRaider/ClickhouseRAG/issues"

[dependency-groups]
dev = [
    "bandit>=1.8",
    "coverage[toml]>=7.13",
    "hypothesis>=6.140",
    "pip-audit>=2.9",
    "pytest>=9",
    "ruff>=0.15",
    "twine>=6.2",
    "ty>=0.0.28",
    "zizmor>=1.32",
]

docs = ["mkdocs>=1.6,<2", "mkdocstrings[python]>=0.29"]
release = ["python-semantic-release==10.7.0"]

[tool.uv]
required-version = ">=0.13.8"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
tag_format = "v{version}"
major_on_zero = true

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.candidates]
match = "release/.*-rc"
prerelease = true
prerelease_token = "rc"

[tool.semantic_release.changelog]
mode = "update"

[tool.hatch.build.targets.wheel]
packages = ["src/clickhouserag"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/README.md", "/LICENSE", "/CHANGELOG.md", "/docs/assets/clickhouserag-icon.png"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = ["integration: requires a real ClickHouse server"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["clickhouserag"]

[tool.coverage.report]
show_missing = true
